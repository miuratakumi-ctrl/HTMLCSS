<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
</head>
<body>
  <script>
    function helloWorld() {
      return "Hello, World!";
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.body.textContent = helloWorld();
    });
  </script>
</body>
</html>
